name: Deploy Landing

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'images/**'
      - 'fonts/**'
      - 'videos/**'
      - 'for-physios/**'
      - 'for-clinics/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
      - '!*.md'

  pull_request:
    branches:
      - main
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'images/**'
      - 'fonts/**'
      - 'videos/**'
      - 'for-physios/**'
      - 'for-clinics/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
      - '!*.md'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        type: string
        default: production

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    # Auto-run only in moovv-fit; manual dispatch allowed in both orgs (ADR-005, CORE-212)
    if: (github.event_name == 'workflow_dispatch' || github.repository_owner == 'moovv-fit') && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') || (github.event_name == 'workflow_call' && inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::855246887543:role/moovv-fit-github-actions-release-role
          aws-region: ap-south-1

      - name: Get CloudFront Distribution ID
        id: cf
        run: |
          DIST_ID=$(aws ssm get-parameter \
            --name "/moovv-fit/staging/landing_cloudfront_distribution_id" \
            --query "Parameter.Value" \
            --output text)
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Stage publish directory (allowlist)
        run: scripts/stage-publish.sh publish
      - name: Guard publish directory
        run: scripts/guard-publish.sh publish
      - name: Sync to S3
        run: |
          # Non-HTML assets: long immutable cache. HTML is excluded here so it is never immutable.
          aws s3 sync publish/ s3://moovv-fit-content-staging/web/landing/ \
            --no-follow-symlinks \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE
          # HTML only: short cache (5 min)
          aws s3 sync publish/ s3://moovv-fit-content-staging/web/landing/ \
            --no-follow-symlinks \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=300" \
            --metadata-directive REPLACE
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cf.outputs.distribution_id }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "## ✅ Landing Deployed to Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **S3**: s3://moovv-fit-content-staging/web/landing/" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: ${{ steps.cf.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://staging.moovv.fit" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    # Auto-run only in moovv-fit; manual dispatch allowed in both orgs (ADR-005, CORE-212)
    if: |
      (github.event_name == 'workflow_dispatch' || github.repository_owner == 'moovv-fit') &&
      (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'workflow_call' && (inputs.environment == 'production' || inputs.environment == ''))
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::855246887543:role/moovv-fit-github-actions-release-role
          aws-region: ap-south-1

      - name: Get CloudFront Distribution ID
        id: cf
        run: |
          DIST_ID=$(aws ssm get-parameter \
            --name "/moovv-fit/production/landing_cloudfront_distribution_id" \
            --query "Parameter.Value" \
            --output text)
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Stage publish directory (allowlist)
        run: scripts/stage-publish.sh publish
      - name: Guard publish directory
        run: scripts/guard-publish.sh publish
      - name: Sync to S3
        run: |
          # Non-HTML assets: long immutable cache. HTML is excluded here so it is never immutable.
          aws s3 sync publish/ s3://moovv-fit-content-production/web/landing/ \
            --no-follow-symlinks \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE
          # HTML only: short cache (5 min)
          aws s3 sync publish/ s3://moovv-fit-content-production/web/landing/ \
            --no-follow-symlinks \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=300" \
            --metadata-directive REPLACE
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cf.outputs.distribution_id }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "## ✅ Landing Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **S3**: s3://moovv-fit-content-production/web/landing/" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: ${{ steps.cf.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://www.moovv.fit" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
