name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::855246887543:role/moovv-fit-github-actions-release-role

jobs:
  release-please:
    # Auto-run only in moovv-fit; manual dispatch allowed in both orgs (ADR-005, CORE-212)
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'moovv-fit'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get GitHub App credentials from SSM
        id: ssm
        run: |
          APP_ID=$(aws ssm get-parameter \
            --name "/moovv-fit/github/release-bot-app-id" \
            --query "Parameter.Value" \
            --output text)
          PRIVATE_KEY=$(aws ssm get-parameter \
            --name "/moovv-fit/github/release-bot-private-key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          # Mask every line: ::add-mask:: only covers single-line values (CORE-212)
          while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::${line}"; fi
          done <<< "$PRIVATE_KEY"
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          {
            echo "private_key<<__RELEASE_BOT_KEY_EOF__"
            echo "$PRIVATE_KEY"
            echo "__RELEASE_BOT_KEY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.ssm.outputs.app_id }}
          private-key: ${{ steps.ssm.outputs.private_key }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Trigger production deploy when release is created
  deploy-production:
    needs: release-please
    # Auto-run only in moovv-fit; manual dispatch allowed in both orgs (ADR-005, CORE-212)
    if: (github.event_name == 'workflow_dispatch' || github.repository_owner == 'moovv-fit') && (needs.release-please.outputs.release_created == 'true')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
